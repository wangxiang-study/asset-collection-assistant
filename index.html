<script>
'use strict';
const paths={home:'M3 11 12 3l9 8M5 10v10h5v-6h4v6h5V10',box:'m3 7 9-4 9 4-9 4-9-4Zm0 0v10l9 4 9-4V7M12 11v10',chart:'M4 20h17M7 16v-5m5 5V5m5 11V8',plus:'M12 5v14M5 12h14',search:'M21 21l-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',settings:'M4 7h16M4 17h16M9 4v6m6 4v6',back:'m14 5-7 7 7 7',phone:'M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm2 3h4m-3 14h2',chair:'M6 13V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8M4 11v6h16v-6M6 17v5m12-5v5M4 13h16',shirt:'m8 3-6 4 3 5 3-2v11h8V10l3 2 3-5-6-4c0 4-8 4-8 0',coffee:'M4 8h12v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8Zm12 1h2a3 3 0 0 1 0 6h-2M7 3v2m5-2v2M2 23h18',spark:'m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z',clock:'M12 8v5l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',arrow:'M5 16 16 5M6 5h10v10',image:'M4 4h16v16H4V4Zm0 12 5-5 7 9m-2-7 3-3 3 3M8 8h.01',edit:'m4 16 12-12 4 4L8 20H4v-4ZM14 6l4 4',down:'M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5',up:'M12 15V3m-5 5 5-5 5 5M4 16v5h16v-5',heart:'M12 20S2 14 2 8c0-6 8-6 10-1 2-5 10-5 10 1 0 6-10 12-10 12Z'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.box}"/></svg>`;
const cats=[['数码','phone'],['家居','chair'],['穿搭','shirt'],['生活','coffee'],['其他','box']];const colors=['#819c7c','#c3ad8c','#9aaabe','#c6a399','#adb5a0'];
const KEY='wuji.personal.v2';let items=[],page='home',filter='全部',category='全部',query='',sort='newest',draftImage='',editing=null;
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2,minimumFractionDigits:2});const sum=(arr,k)=>arr.reduce((s,i)=>s+Number(i[k]||0),0);const days=i=>Math.max(1,Math.floor((new Date(today()+'T00:00:00')-new Date(i.date+'T00:00:00'))/86400000)+1);const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const active=()=>items.filter(i=>i.status==='在用');
let storageError=false;try{const saved=localStorage.getItem(KEY);if(saved)items=normalize(JSON.parse(saved));}catch(e){storageError=true;}
function normalize(raw){const arr=Array.isArray(raw)?raw:raw.items;if(!Array.isArray(arr))throw Error('无效的数据格式');const ids=new Set();return arr.map(i=>{if(!i||typeof i.name!=='string'||!i.name.trim())throw Error('物品名称缺失');const price=Number(i.price??i.purchasePrice??0),value=Number(i.value??i.currentValue??price),date=String(i.date??i.purchaseDate??today());if(!Number.isFinite(price)||price<0||!Number.isFinite(value)||value<0||!/^\d{4}-\d{2}-\d{2}$/.test(date)||isNaN(new Date(date+'T00:00:00').getTime())||date>today())throw Error('价格或日期无效');let id=String(i.id||uid());if(ids.has(id))id=uid();ids.add(id);return{id,name:i.name.trim().slice(0,100),category:cats.some(c=>c[0]===i.category)?i.category:'其他',status:['在用','心愿','已出'].includes(i.status)?i.status:'在用',price,value,date,location:String(i.location||''),tags:Array.isArray(i.tags)?i.tags.join('，'):String(i.tags||''),note:String(i.note??i.notes??''),image:typeof i.image==='string'&&/^data:image\/(png|jpeg|webp);base64,/.test(i.image)?i.image:''};});}
function save(next){try{localStorage.setItem(KEY,JSON.stringify(next));items=next;return true}catch(e){toast('保存失败：本地空间不足或浏览器禁止存储，请先导出备份');return false}}
function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),4200)}
function confirmAction(title,text,fn){document.querySelector('#dialogTitle').textContent=title;document.querySelector('#dialogText').textContent=text;document.querySelector('#confirmButton').onclick=()=>{document.querySelector('#dialog').close();fn()};document.querySelector('#dialog').showModal()}
function art(i){if(i.image)return `<img src="${esc(i.image)}" alt="${esc(i.name)}">`;const type=cats.find(c=>c[0]===i.category)?.[1]||'box';return `<svg viewBox="0 0 120 120" aria-hidden="true"><ellipse cx="60" cy="106" rx="30" ry="4" fill="#243c350a" stroke="none"/><g transform="translate(24 18) scale(3)" fill="${i.category==='数码'?'#d7e0d5':'#e2dccf'}" stroke="#758775" stroke-width=".65"><path d="${paths[type]}"/></g></svg>`}
function card(i){return `<button class="item" data-detail="${esc(i.id)}"><div class="art" style="background:${i.category==='穿搭'?'#eff0f4':i.category==='生活'?'#f5efeb':'#f0f2eb'}">${art(i)}<span class="badge">${esc(i.category)}</span></div><div class="item-body"><div class="item-title">${esc(i.name)}</div><div class="item-meta">${i.status==='心愿'?'心愿清单':i.status==='已出'?'已离开收藏':`已相伴 ${days(i)} 天`} ${i.location?'· '+esc(i.location):''}</div><div class="item-bottom"><span>¥ ${money(i.price)}</span><small>${i.status==='在用'?'¥ '+money(i.price/days(i))+' / 天':esc(i.status)}</small></div></div></button>`}
function empty(){return `<div class="empty">${icon('box')}<h2>${items.length?'暂时没有符合条件的持物':'为喜欢的物品，留一个位置'}</h2><p>${items.length?'换一个分类或搜索词试试':'从第一件持物开始，记录它与你的日常。'}</p><button class="primary" onclick="go('add')">${icon('plus')} 添加持物</button>${items.length?'':'<p><button class="text-btn" onclick="loadDemo()">先看看示例 →</button></p>'}</div>`}
function go(p,id){page=p;render(id);window.scrollTo(0,0)}
function render(id){const navPage=page==='detail'?'items':page;document.querySelector('#nav').innerHTML=[['home','home','概览'],['items','box','持物'],['add','plus',''],['stats','chart','统计'],['settings','settings','我的']].map(([p,ic,label])=>`<button onclick="go('${p}')" aria-label="${label||'新增持物'}" ${navPage===p?'aria-current="page"':''} class="${p==='add'?'add':navPage===p?'active':''}">${icon(ic)}${label}</button>`).join('');const app=document.querySelector('#app');app.innerHTML=page==='home'?home():page==='items'?list():page==='stats'?stats():page==='settings'?settings():page==='detail'?detail(id):form(page==='edit'?id:null);app.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>go('detail',b.dataset.detail));if(page==='add'||page==='edit')bindForm();}
function home(){const a=active(),total=sum(a,'value'),cost=sum(a,'price'),month=items.filter(i=>i.status!=='心愿'&&i.date.slice(0,7)===today().slice(0,7)).length;return `<div class="eyebrow">MY LITTLE COLLECTION</div><h1>让拥有，恰到好处。</h1><div class="sub">每一件喜欢的物品，都值得好好记录。</div><div class="home-columns"><section class="hero"><div class="sub" style="color:#6a7f64">在用资产总估值</div><div class="balance"><small>¥</small>${money(total)}</div><span class="pill">珍惜拥有的每一份价值</span><div class="hero-foot"><div><span>在用持物</span><b>${a.length} <small class="sub">件</small></b></div><div><span>累计购入</span><b>¥ ${money(cost)}</b></div><div><span>本月新增</span><b>${month} <small class="sub">件</small></b></div></div></section><div class="side"><div class="overview"><div class="metric"><span class="metric-icon">${icon('clock')}</span><div><small>平均相伴</small><b>${a.length?Math.round(a.reduce((s,i)=>s+days(i),0)/a.length):0} <small>天</small></b></div></div><div class="metric"><span class="metric-icon">${icon('spark')}</span><div><small>平均单品日成本</small><b><small>¥</small> ${money(a.length?a.reduce((s,i)=>s+i.price/days(i),0)/a.length:0)}</b></div></div></div><div class="heading"><h2>按分类发现</h2><span class="sub">生活的不同切面</span></div><div class="category-grid">${cats.map(([c,ic])=>`<button class="category" onclick="category='${c}';filter='全部';query='';go('items')"><span class="category-icon">${icon(ic)}</span><span>${c}</span><small>${items.filter(i=>i.category===c).length} 件</small></button>`).join('')}</div></div></div><div class="heading"><h2>最近的持物 <span class="sub" style="margin-left:8px">RECENT</span></h2><button class="text-btn" onclick="category='全部';filter='全部';query='';go('items')">查看全部 ↗</button></div><div class="items">${items.length?[...items].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(card).join(''):empty()}</div><p class="quote">物尽其用 · 日有所爱</p>`}
function list(){return `<div class="eyebrow">THINGS I LOVE</div><h1>我的持物 <span class="sub">${items.length} 件收藏</span></h1><div class="toolbar"><label class="search">${icon('search')}<input id="search" placeholder="寻找一件持物…" value="${esc(query)}" oninput="query=this.value;refreshList()"></label><select aria-label="排序" onchange="sort=this.value;refreshList()"><option value="newest" ${sort==='newest'?'selected':''}>最近购入</option><option value="price" ${sort==='price'?'selected':''}>价格从高到低</option><option value="oldest" ${sort==='oldest'?'selected':''}>相伴最久</option></select></div><div class="tabs">${['全部','在用','心愿','已出'].map(s=>`<button class="${filter===s?'selected':''}" onclick="filter='${s}';render()">${s}</button>`).join('')}</div><div class="toolbar" style="justify-content:space-between;margin:15px 0 22px"><span class="sub" id="resultsCount"></span><select aria-label="分类" onchange="category=this.value;refreshList()">${['全部',...cats.map(c=>c[0])].map(c=>`<option ${category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="items list" id="results">${listContent()}</div>`}
function filtered(){return items.filter(i=>(filter==='全部'||i.status===filter)&&(category==='全部'||i.category===category)&&[i.name,i.tags,i.location].some(v=>v.toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>sort==='price'?b.price-a.price:sort==='oldest'?a.date.localeCompare(b.date):b.date.localeCompare(a.date))}
function listContent(){const arr=filtered();setTimeout(()=>{const el=document.querySelector('#resultsCount');if(el)el.textContent=`${category==='全部'?'全部分类':category} · ${arr.length} 件持物`},0);return arr.length?arr.map(card).join(''):empty()}
function refreshList(){document.querySelector('#results').innerHTML=listContent();document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>go('detail',b.dataset.detail))}
function detail(id){const i=items.find(x=>x.id===id);if(!i)return empty();const d=days(i),daily=i.price/d;return `<div class="detail-top"><button class="round" onclick="go('items')" aria-label="返回持物列表">${icon('back')}</button><span class="sub">持物详情</span><button class="round" id="editItem" aria-label="编辑物品">${icon('edit')}</button></div><div class="detail-hero"><div class="art">${art(i)}</div><h1>${esc(i.name)}</h1><span class="pill">${esc(i.status)} · ${esc(i.category)}</span></div><div class="detail-grid"><div class="panel"><div class="cost-head"><div><span class="sub">${i.status==='心愿'?'计划购入价':'当前日均成本'}</span><b>¥ ${money(i.status==='心愿'?i.price:daily)}</b></div><div style="text-align:right"><span class="sub">${i.status==='心愿'?'状态':'持有时长'}</span><b>${i.status==='心愿'?'心愿':d+' <small class="sub">天</small>'}</b></div></div>${i.status==='心愿'?'<p class="note">心愿物品不计入在用资产与持有成本。</p>':`<div class="bars">${Array.from({length:8},(_,n)=>`<div class="bar" style="height:${Math.max(10,100/(1+n*.65))}%" title="持有 ${Math.max(1,Math.round(d*(n+1)/8))} 天：日均 ¥${money(i.price/Math.max(1,Math.round(d*(n+1)/8)))}"></div>`).join('')}</div><div class="bar-label"><span>购入时</span><span>时间越久，相伴的成本越轻</span><span>今天</span></div>`}</div><div class="panel"><div class="cost-head"><div><span class="sub">当前估值</span><b>¥ ${money(i.value)}</b></div><div style="text-align:right"><span class="sub">较购入价</span><b style="color:#809878">${i.value-i.price>=0?'+':'−'}${money(Math.abs(i.value-i.price))}</b></div></div><div style="margin-top:29px" class="sub">估值保留率 <span style="float:right">${i.price?Math.round(i.value/i.price*100):'—'}${i.price?'%':''}</span></div><div class="progress"><div style="width:${i.price?Math.min(100,i.value/i.price*100):0}%"></div></div><p class="note">估值由你记录，日成本按购入价 ÷ 持有天数计算。</p></div></div><div class="panel">${[['购买价格','¥ '+money(i.price)],['购买日期',i.date.replaceAll('-','.')],['所在位置',i.location||'未设置'],['物品标签',i.tags||'未设置']].map(([k,v])=>`<div class="row"><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div>${i.note?`<div class="panel"><span class="sub">关于这件物品</span><p style="white-space:pre-wrap">${esc(i.note)}</p></div>`:''}<div style="text-align:center"><button class="text-btn danger" id="deleteItem">删除这件持物</button></div>${bindDetailLater(i)}`}
function bindDetailLater(i){setTimeout(()=>{const edit=document.querySelector('#editItem'),del=document.querySelector('#deleteItem');if(edit)edit.onclick=()=>go('edit',i.id);if(del)del.onclick=()=>confirmAction('删除这件持物？','此操作不可撤销。你可以先在“我的”中导出备份。',()=>{if(save(items.filter(x=>x.id!==i.id))){go('items');toast('持物已删除')}})},0);return ''}
function stats(){const a=active(),cost=sum(a,'price'),value=sum(a,'value'),parts=cats.map(([c],n)=>({c,n,v:sum(a.filter(i=>i.category===c),'value')}));let angle=0;const gradient=parts.filter(p=>p.v>0).map(p=>{const start=angle;angle+=p.v/(value||1)*100;return `${colors[p.n]} ${start}% ${angle}%`}).join(',');const months=Array.from({length:6},(_,n)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+n);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;return{label:d.getMonth()+1+'月',v:sum(items.filter(i=>i.status!=='心愿'&&i.date.startsWith(key)),'price')}});const max=Math.max(1,...months.map(m=>m.v));return `<div class="eyebrow">A LITTLE PERSPECTIVE</div><h1>拥有的另一面</h1><div class="sub">从数字里，看见自己的生活偏好。</div><div class="overview"><div class="metric"><div><small>累计购入 · 不含心愿</small><b>¥ ${money(sum(items.filter(i=>i.status!=='心愿'),'price'))}</b></div></div><div class="metric"><div><small>在用资产估值保留率</small><b>${cost?Math.round(value/cost*100)+'%':'—'}</b></div></div></div><div class="detail-grid" style="margin-top:20px"><section class="panel"><h2>资产分布</h2><div class="donut" style="background:${gradient?'conic-gradient('+gradient+')':'#e9efe5'}"><div><b>${a.length}</b><span class="sub">在用持物</span></div></div>${parts.map(p=>`<div class="row"><span><i class="legend-dot" style="background:${colors[p.n]}"></i>${p.c}</span><b>¥ ${money(p.v)} <small class="sub" style="margin-left:10px">${value?Math.round(p.v/value*100):0}%</small></b></div>`).join('')}</section><section class="panel"><h2>最近六个月的购入</h2><p class="sub">每一次选择，都更了解自己。</p><div class="bars" style="height:200px">${months.map(m=>`<div style="flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:10px"><small class="sub" style="font-size:9px">${m.v?Math.round(m.v).toLocaleString():0}</small><div class="bar" style="flex:none;width:75%;height:${Math.max(2,m.v/max*140)}px"></div></div>`).join('')}</div><div class="bar-label">${months.map(m=>`<span style="flex:1;text-align:center">${m.label}</span>`).join('')}</div><div class="row" style="margin-top:30px"><span>在用</span><b>${a.length} 件</b></div><div class="row"><span>等待实现的心愿</span><b>${items.filter(i=>i.status==='心愿').length} 件</b></div><div class="row"><span>已告别的物品</span><b>${items.filter(i=>i.status==='已出').length} 件</b></div><p class="note">分类占比按在用物品的当前估值计算。</p></section></div>`}
function form(id){const i=items.find(x=>x.id===id)||{name:'',category:'数码',status:'在用',price:'',value:'',date:today(),location:'',tags:'',note:'',image:''};editing=id;draftImage=i.image;const input=(label,name,type='text',placeholder='选填')=>`<label class="field"><span>${label}</span><input name="${name}" type="${type}" value="${esc(i[name])}" placeholder="${placeholder}" ${['name','price','date'].includes(name)?'required':''} ${type==='number'?'min="0" step="0.01" max="999999999"':''} ${type==='date'?`max="${today()}"`:''} ${name==='name'?'maxlength="100"':''}></label>`;return `<div class="form-wrap"><div class="detail-top"><button class="round" onclick="go('items')" aria-label="返回">${icon('back')}</button><h2>${id?'编辑持物':'记录一件好物'}</h2><span style="width:40px"></span></div><p class="sub" style="text-align:center;margin:18px 0 26px">${id?'认真记录，让陪伴有迹可循。':'从此刻开始，记录它与你的故事。'}</p><form id="itemForm"><label class="upload"><span class="upload-icon" id="imagePreview">${i.image?`<img src="${esc(i.image)}" alt="物品图片">`:icon('image')}</span><span><strong>给物品拍张照</strong><span class="sub">选择一张喜欢的图片 · 可选</span></span><input type="file" accept="image/png,image/jpeg,image/webp" id="photoInput" hidden></label><button type="button" id="removePhoto" class="text-btn ${i.image?'':'hidden'}">移除图片</button><div class="form-label">基本信息</div><div class="form-panel">${input('物品名称','name','text','例如：每天陪伴的耳机')}<label class="field"><span>资产分类</span><select name="category">${cats.map(([c])=>`<option ${i.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field"><span>持物状态</span><select name="status">${['在用','心愿','已出'].map(s=>`<option ${i.status===s?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="form-label">价格与时间</div><div class="form-panel">${input('购入价格 ¥','price','number','0.00')}${input('当前估值 ¥','value','number','默认等于购入价格')}${input('购入 / 记录日','date','date')}</div><div class="form-label">生活里的位置</div><div class="form-panel">${input('所在位置','location','text','例如：书房 · 桌面')}${input('标签','tags','text','用逗号分隔')}<label class="field"><span>备注</span><textarea name="note" rows="3" placeholder="为什么喜欢它，或想记住的细节…">${esc(i.note)}</textarea></label></div><p class="note" style="padding:8px 5px">心愿物品不计入在用资产；估值可以在之后随时调整。</p><div class="form-actions"><button type="button" class="secondary" onclick="go('items')">取消</button><button class="primary" type="submit">保存持物</button></div></form></div>`}
function bindForm(){const f=document.querySelector('#itemForm');f.onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(f));if(!data.name.trim()){toast('请填写物品名称');return}try{const item=normalize([{...data,id:editing||uid(),value:data.value===''?data.price:data.value,image:draftImage}])[0];const next=editing?items.map(i=>i.id===editing?item:i):[item,...items];if(save(next)){go('detail',item.id);toast('已保存，好好享受它的陪伴')}}catch(e){toast(e.message)}};document.querySelector('#removePhoto').onclick=()=>{draftImage='';document.querySelector('#imagePreview').innerHTML=icon('image');document.querySelector('#removePhoto').classList.add('hidden');document.querySelector('#photoInput').value=''};document.querySelector('#photoInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('请选择 JPG、PNG 或 WebP 图片');return}if(file.size>20*1024*1024){toast('请选择小于 20 MB 的图片');return}const submit=f.querySelector('[type=submit]');submit.disabled=true;try{draftImage=await resizeImage(file);document.querySelector('#imagePreview').innerHTML=`<img src="${draftImage}" alt="物品图片">`;document.querySelector('#removePhoto').classList.remove('hidden')}catch(e){toast('图片读取失败，请重新选择')}finally{submit.disabled=false}}}
function resizeImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const ratio=Math.min(1,800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);const ctx=c.getContext('2d');ctx.fillStyle='#f1f2ed';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.8))}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error())};img.src=url})}
function settings(){return `<div class="eyebrow">A SPACE OF YOUR OWN</div><h1>我的小小收藏室</h1><p class="sub">轻一点拥有，久一点喜欢。</p><div class="panel"><div style="display:flex;align-items:center;gap:18px"><span class="metric-icon">${icon('box')}</span><div><h2>${items.length} 件有故事的物品</h2><p class="sub" style="margin:6px 0 0">数据保存在当前浏览器中</p></div></div></div><div class="panel"><button class="row" style="width:100%" onclick="installWuji()"><span>添加到手机桌面</span><b>↗</b></button><p class="note">独立窗口打开，首次加载后支持离线使用。</p></div><div class="form-label">数据与备份</div><div class="panel"><button class="row" style="width:100%" onclick="exportData()"><span>${icon('down')}　导出 JSON 备份</span><b>↗</b></button><button class="row" style="width:100%" onclick="document.querySelector('#importFile').click()"><span>${icon('up')}　导入 JSON 备份</span><b>↗</b></button><button class="row" style="width:100%" onclick="loadDemo()"><span>${icon('spark')}　添加示例收藏</span><b>↗</b></button></div><p class="note" style="padding:0 8px">建议定期导出备份。清除浏览器数据、更换浏览器或移动 HTML 文件，可能无法读取原来的本地记录。导入支持本版数据及常见的 items 数组格式；导入前会检查内容并提示确认。</p><div class="panel"><div class="row"><span>外观</span><b>柔和浅色</b></div><div class="row"><span>版本</span><b>物记 2.1 · 桌面应用</b></div><div class="row"><span>网络</span><b>无需联网即可使用</b></div></div><p class="quote">留住喜欢的，让生活轻盈。</p>`}
function exportData(){const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),items},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`物记备份-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('备份已生成')}
document.querySelector('#importFile').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>20*1024*1024){toast('备份文件超过 20 MB');return}try{const next=normalize(JSON.parse(await file.text()));confirmAction(`导入 ${next.length} 件持物？`,'导入将替换当前收藏，请确认已导出需要保留的数据。',()=>{if(save(next)){go('items');toast('备份已导入')}})}catch(e){toast('无法导入：'+e.message)}};
function loadDemo(){const demo=[['随身的 iPhone','数码',5999,4200,180,'随身'],['降噪耳机','数码',1899,1250,62,'通勤包'],['阅读角的椅子','家居',1299,900,245,'客厅'],['日常帆布包','穿搭',329,230,35,'衣帽间'],['手冲咖啡杯','生活',168,120,14,'厨房'],['想要的阅读器','数码',1299,1299,1,'心愿清单']];const entries=demo.map(([name,category,price,value,ago,location],n)=>{const dt=new Date();dt.setDate(dt.getDate()-ago);const date=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;return{id:uid(),name,category,price,value,date,location,status:n===5?'心愿':'在用',tags:'示例',note:'这是一条示例记录，可自由编辑或删除。',image:''}});const add=()=>{if(save([...items,...entries])){go('home');toast('已添加 6 件示例持物')}};if(items.length)confirmAction('添加示例收藏？','将在当前收藏中追加 6 件标有“示例”标签的物品。',add);else add()}
document.querySelector('#brandIcon').innerHTML=icon('box');document.querySelector('#searchButton').innerHTML=icon('search');document.querySelector('#settingsButton').innerHTML=icon('settings');render();if(storageError)toast('本地记录读取失败，未覆盖原数据；请尝试导入备份。');
</script><script>
let installPrompt=null;
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;});
window.addEventListener('appinstalled',()=>{installPrompt=null;toast('物记已添加到桌面');});
async function installWuji(){
 if(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone){toast('你正在使用桌面版物记');return;}
 if(installPrompt){const prompt=installPrompt;installPrompt=null;await prompt.prompt();await prompt.userChoice;return;}
 const isApple=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 document.querySelector('#dialogTitle').textContent='添加到手机桌面';
 document.querySelector('#dialogText').textContent=isApple?'请用 Safari 打开本页，点击分享按钮，再选择“添加到主屏幕”。':'请用 Chrome 或 Edge 打开本页，点击浏览器菜单，选择“安装应用”或“添加到主屏幕”。';
 document.querySelector('#confirmButton').onclick=()=>document.querySelector('#dialog').close();
 document.querySelector('#dialog').showModal();
}
if('serviceWorker' in navigator&&location.protocol!=='file:'){
 window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{toast('离线缓存暂不可用，请联网刷新后重试');});});
}
</script></body></html>
