   <section class="detail-hero"><div class="hero-toolbar"><span :class="['badge',{'retired':!['active','idle'].includes(item.status)}]">{{statusLabel(item)}}</span><button class="icon-button small" :class="{accent:item.pinned}" @click="togglePin" aria-label="\u7F6E\u9876\u8D44\u4EA7"><icon name="pin" :size="19"/></button></div><button class="hero-image-button" @click="item.photo&&(lightbox=item.photo)" :aria-label="item.photo?'\u67E5\u770B\u7269\u54C1\u56FE\u7247':'\u7269\u54C1\u56FE\u6807'"><asset-image :item="item" large/></button><h2>{{item.name}}</h2><p>{{categoryName(item.categoryId)}}<span> \xB7 </span>{{kindLabel(item.kind)}}</p><div class="hero-actions"><button @click="newRecord('maintenance')" :disabled="!['active','idle'].includes(item.status)"><icon name="wrench" :size="17"/>\u7EF4\u62A4</button><button @click="useOnce" :disabled="!['active','idle'].includes(item.status)"><icon name="plus" :size="17"/>{{item.costMode==='quantity'?'\u8BB0\u5F55\u7528\u91CF':'\u8BB0\u5F55\u4F7F\u7528'}}</button><button @click="editItem"><icon name="edit" :size="17"/>\u7F16\u8F91</button></div></section>
   <section class="card detail-cost-card"><div class="metric-pair"><div><span class="label">\u5F53\u524D{{modeLabel(item)}}\u6210\u672C</span><strong>{{detail.current===null?'\u6682\u65E0\u8BB0\u5F55':money(detail.current,item.currency)}}</strong></div><div class="align-right"><span class="label">{{['sold','archived'].includes(item.status)?'\u7D2F\u8BA1\u4F7F\u7528':'\u4F7F\u7528\u5929\u6570'}}</span><strong>{{detail.days}}<small>\u5929</small></strong></div></div><div class="bar-chart detail-bars" aria-label="\u6210\u672C\u53D8\u5316\u56FE"><button v-for="(b,idx) in bars" :key="idx" class="bar-column" :class="{chosen:chartSelected===idx}" @click="chartSelected=idx" :aria-label="b.date+' \u6210\u672C '+b.value.toFixed(2)"><span class="bar" :style="{height:Math.max(4,Math.abs(b.value)/barsMax(bars)*95)+'%'}"></span></button></div><div class="chart-caption"><span>{{chartSelected>=0?bars[chartSelected]?.date:item.purchaseDate.replaceAll('-','.')}}</span><span>{{chartSelected>=0?money(bars[chartSelected]?.value||0,item.currency)+'/'+unit(item):'\u968F\u4F7F\u7528\u9010\u6E10\u644A\u8584'}}</span></div><p v-if="['sold','archived'].includes(item.status)" class="subtle-note">\u5DF2\u4E8E {{item.stopDate}} \u505C\u6B62\u7D2F\u8BA1\u4F7F\u7528\u5929\u6570</p></section>
   <section v-if="item.goalMode!=='none'" class="card goal-card"><div class="metric-pair"><div><span class="label">\u76EE\u6807{{modeLabel(item)}}\u6210\u672C</span><strong>{{money(detail.targetCost,item.currency)}}</strong></div><div class="align-right"><span class="label">\u603B\u8FDB\u5EA6</span><strong>{{detail.progress.toFixed(1)}}<small>%</small></strong></div></div><div class="goal-progress"><span :style="{width:detail.progress+'%'}"></span></div><div class="goal-labels"><span>\u5F53\u524D {{detail.current===null?'\u2014':money(detail.current,item.currency)}}</span><span>\u76EE\u6807 {{money(detail.targetCost,item.currency)}}</span></div><div class="goal-foot"><template v-if="detail.progress>=100"><span class="accent"><icon name="check" :size="15"/> \u5DF2\u8FBE\u6210\u76EE\u6807</span><span>\u8D8A\u7528\uFF0C\u8D8A\u503C\u5F97</span></template><template v-else-if="!['active','idle'].includes(item.status)"><span>\u4F7F\u7528\u5DF2\u7ED3\u675F</span><span>\u76EE\u6807\u672A\u8FBE\u6210</span></template><template v-else><span>{{detail.goalDate?'\u9884\u8BA1\u8FBE\u6210\uFF1A'+detail.goalDate.replaceAll('-','.'): '\u7EE7\u7EED\u8BB0\u5F55\u4F7F\u7528\uFF0C\u9010\u6B65\u8FBE\u6210'}}</span><span>\u8FD8\u9700 {{Math.ceil(detail.remaining)}} {{unit(item)}}</span></template></div></section>
   <section v-else class="card goal-prompt"><icon name="target"/><div><strong>\u7ED9\u5B83\u8BBE\u4E00\u4E2A\u5C0F\u76EE\u6807</strong><p>\u671F\u5F85\u6BCF\u5929\u3001\u6BCF\u6B21\u4F7F\u7528\u7684\u6210\u672C\u964D\u5230\u591A\u5C11\uFF1F</p></div><button class="text-button accent" @click="editItem">\u8BBE\u7F6E</button></section>
   <section class="card info-card"><div class="info-row"><span>\u8D44\u4EA7\u7C7B\u578B</span><strong>{{kindLabel(item.kind)}}</strong></div><div class="info-row"><span>\u8D44\u4EA7\u5206\u7C7B</span><strong>{{categoryName(item.categoryId)}}</strong></div><div v-if="item.customStatus" class="info-row"><span>\u81EA\u5B9A\u4E49\u72B6\u6001</span><strong>{{item.customStatus}}</strong></div></section>
   <section class="card info-card"><div class="info-row"><span>\u8D2D\u4E70\u4EF7\u683C</span><strong>{{money(item.price,item.currency)}}</strong></div><div class="info-row"><span>\u8D2D\u4E70\u65E5\u671F</span><strong>{{item.purchaseDate.replaceAll('-','.')}}</strong></div><div class="info-row"><span>\u8D2D\u4E70\u6E20\u9053</span><strong>{{item.channel||'\u672A\u8BBE\u7F6E'}}</strong></div><template v-if="item.warrantyEnabled"><div class="info-row"><span>{{item.kind==='virtual'?'\u6709\u6548\u72B6\u6001':'\u4FDD\u969C\u72B6\u6001'}}</span><strong :class="item.warrantyEnd<today()?'danger':'accent'">{{item.warrantyEnd<today()?'\u5DF2\u8FC7\u671F':'\u6709\u6548\u671F\u5185'}}</strong></div><div class="info-row"><span>{{item.kind==='virtual'?'\u5230\u671F\u65E5\u671F':'\u4FDD\u969C\u5230\u671F'}}</span><strong>{{item.warrantyEnd.replaceAll('-','.')}}</strong></div></template><div v-if="item.kind==='investment'&&item.currentValue!==null&&item.currentValue!==''" class="info-row"><span>\u5F53\u524D\u4F30\u503C</span><strong>{{money(Number(item.currentValue),item.currency)}}</strong></div><div v-if="item.kind==='investment'&&item.currentValue!==null&&item.currentValue!==''" class="info-row"><span>\u4F30\u503C\u4E0E\u51C0\u6295\u5165\u5DEE\u989D</span><strong :class="Number(item.currentValue)-detail.net>=0?'accent':'danger'">{{money(Number(item.currentValue)-detail.net,item.currency)}}</strong></div><div v-if="item.status==='sold'" class="info-row"><span>\u552E\u51FA\u56DE\u6536</span><strong class="accent">{{money(item.salePrice,item.currency)}}</strong></div></section>
   <section class="card info-card"><button class="info-row row-button" @click="openRecords('maintenance')"><span>\u7EF4\u62A4\u8D39\u7528 <small>{{item.maintenance.length}} \u6B21</small></span><strong class="amber">{{money(detail.maintenance,item.currency)}} <icon name="chevron" :size="16"/></strong></button><button class="info-row row-button" @click="openRecords('accessories')"><span>\u914D\u4EF6\u8D39\u7528 <small>{{item.accessories.length}} \u9879</small></span><strong>{{money(detail.accessories,item.currency)}} <icon name="chevron" :size="16"/></strong></button><button class="info-row row-button" @click="openRecords('usage')"><span>\u4F7F\u7528\u8BB0\u5F55</span><strong>{{detail.uses}} \u6B21<template v-if="item.costMode==='quantity'"> \xB7 {{detail.quantity}} {{item.quantityUnit}}</template><icon name="chevron" :size="16"/></strong></button><div class="info-row"><span>\u7D2F\u8BA1\u51C0\u6295\u5165</span><strong>{{money(detail.net,item.currency)}}</strong></div></section>
   <section v-if="item.note||item.photos.length" class="card note-card"><h3>\u5907\u6CE8</h3><p>{{item.note||'\u56FE\u7247\u8BB0\u5F55'}}</p><div class="photo-gallery"><button v-for="photo in item.photos" @click="lightbox=photo"><img :src="photo" alt="\u5907\u6CE8\u56FE\u7247"/></button></div></section>
   <p class="subtle-note calculation-note">{{modeLabel(item)}}\u6210\u672C =\uFF08\u8D2D\u4E70\u4EF7\uFF0B\u8BA1\u5165\u6210\u672C\u7684\u7EF4\u62A4\u8D39\uFF0B\u914D\u4EF6\u8D39\uFF0D\u552E\u51FA\u56DE\u6536\uFF09\xF7 {{item.costMode==='day'?'\u4F7F\u7528\u5929\u6570\uFF08\u8D2D\u4E70\u5F53\u5929\u8BA11\u5929\uFF09':item.costMode==='use'?'\u4F7F\u7528\u6B21\u6570':'\u7D2F\u8BA1\u7528\u91CF'}}<br/>{{item.excludeStats?'\u6B64\u8D44\u4EA7\u4E0D\u8BA1\u5165\u6C47\u603B\u7EDF\u8BA1\u3002':'\u4E0D\u540C\u5E01\u79CD\u5206\u522B\u7EDF\u8BA1\u3002'}}</p>
   <button class="delete-asset" @click="deleteCurrent"><icon name="trash" :size="17"/>\u5220\u9664\u8D44\u4EA7</button>
  </template>

  <form v-if="page==='edit'" class="asset-form" @submit.prevent="saveItem">
   <section class="card name-card"><label class="image-upload"><asset-image :item="draft"/><input type="file" accept="image/*" @change="uploadImage($event,'photo')" aria-label="\u4E0A\u4F20\u7269\u54C1\u56FE\u7247"/><span class="photo-edit"><icon name="plus" :size="12"/></span></label><label class="name-field"><span>\u7269\u54C1\u540D\u79F0</span><input v-model="draft.name" placeholder="\u7ED9\u8FD9\u4EF6\u7269\u54C1\u8D77\u4E2A\u540D\u5B57" maxlength="100" aria-label="\u7269\u54C1\u540D\u79F0"/></label></section>
   <div class="emoji-row"><button v-for="e in ['\u{1F4F1}','\u{1F4BB}','\u{1F3A7}','\u{1F4F7}','\u231A','\u{1F4D6}','\u{1FA91}','\u{1F372}','\u{1F45F}','\u{1F9F4}','\u{1F9D8}','\u{1F3B5}','\u{1F48E}','\u{1F4E6}']" type="button" :class="{active:draft.icon===e&&!draft.photo}" @click="draft.icon=e;draft.photo=''" :aria-label="'\u9009\u62E9\u56FE\u6807'+e">{{e}}</button></div>
   <section class="card form-group"><div class="field-row"><span>\u8D44\u4EA7\u7C7B\u578B</span><div class="segmented"><button v-for="k in [{v:'asset',n:'\u8D44\u4EA7'},{v:'investment',n:'\u6295\u8D44'},{v:'virtual',n:'\u865A\u62DF'}]" type="button" :class="{active:draft.kind===k.v}" @click="draft.kind=k.v">{{k.n}}</button></div></div><label class="field-row"><span>\u8D44\u4EA7\u5206\u7C7B</span><select v-model="draft.categoryId" aria-label="\u8D44\u4EA7\u5206\u7C7B"><option v-for="c in categories" :value="c.id">{{c.name}}</option></select><icon name="chevron" :size="16"/></label><label class="field-row"><span>\u81EA\u5B9A\u4E49\u72B6\u6001</span><select v-model="draft.customStatus" @change="setCustomStatus" aria-label="\u81EA\u5B9A\u4E49\u72B6\u6001"><option v-for="s in [...new Set([...db.settings.customStatuses,draft.customStatus])].filter(Boolean)" :value="s">{{s}}</option></select><icon name="chevron" :size="16"/></label></section>
   <section class="card form-group"><div class="field-row"><label for="purchase-price">\u8D2D\u4E70\u4EF7\u683C</label><input id="purchase-price" type="number" min="0" max="10000000000" step="0.01" inputmode="decimal" v-model="draft.price" placeholder="0.00"/><select class="currency-select" v-model="draft.currency" aria-label="\u8D2D\u4E70\u5E01\u79CD"><option>CNY</option><option>USD</option><option>EUR</option><option>HKD</option><option>JPY</option></select></div><label class="field-row"><span>\u8D2D\u4E70\u65E5\u671F</span><input type="date" v-model="draft.purchaseDate" :max="today()" aria-label="\u8D2D\u4E70\u65E5\u671F"/></label><label class="field-row"><span>\u8D2D\u4E70\u6E20\u9053</span><input v-model="draft.channel" list="purchase-channels" placeholder="\u672A\u8BBE\u7F6E" aria-label="\u8D2D\u4E70\u6E20\u9053" maxlength="60"/><icon name="chevron" :size="16"/></label><datalist id="purchase-channels"><option v-for="s in db.settings.channels" :value="s"/></datalist><label v-if="draft.kind==='investment'" class="field-row"><span>\u5F53\u524D\u4F30\u503C</span><input type="number" min="0" step="0.01" v-model="draft.currentValue" placeholder="\u9009\u586B\uFF0C\u624B\u52A8\u66F4\u65B0" aria-label="\u5F53\u524D\u4F30\u503C"/></label></section>
   <section class="card form-group"><label class="field-row"><span>\u6210\u672C\u8BA1\u7B97\u6A21\u5F0F</span><select v-model="draft.costMode" @change="draft.costMode!=='day'&&draft.goalMode==='date'&&(draft.goalMode='price')" aria-label="\u6210\u672C\u8BA1\u7B97\u6A21\u5F0F"><option value="day">\u6309\u65E5\u8BA1\u7B97</option><option value="use">\u6309\u6B21\u8BA1\u7B97</option><option value="quantity">\u6309\u91CF\u8BA1\u7B97</option></select><icon name="chevron" :size="16"/></label><template v-if="draft.costMode==='use'"><label class="field-row"><span>\u521D\u59CB\u4F7F\u7528\u6B21\u6570</span><input type="number" min="0" step="1" v-model="draft.useCount" aria-label="\u521D\u59CB\u4F7F\u7528\u6B21\u6570"/></label><p class="field-hint">\u7528\u4E8E\u8865\u5F55\u8FC7\u53BB\u7684\u6B21\u6570\uFF1B\u65B0\u589E\u4F7F\u7528\u8BB0\u5F55\u4F1A\u7EE7\u7EED\u7D2F\u52A0\u3002</p></template><template v-if="draft.costMode==='quantity'"><label class="field-row"><span>\u7528\u91CF\u5355\u4F4D</span><input v-model="draft.quantityUnit" placeholder="ml\u3001g \u7B49" maxlength="10" aria-label="\u7528\u91CF\u5355\u4F4D"/></label><label class="field-row"><span>\u521D\u59CB\u7D2F\u8BA1\u7528\u91CF</span><input type="number" min="0" step="0.01" v-model="draft.quantityUsed" aria-label="\u521D\u59CB\u7D2F\u8BA1\u7528\u91CF"/></label></template><div class="field-row goal-selection"><span>\u76EE\u6807\u8BBE\u5B9A</span><div class="segmented"><button type="button" :class="{active:draft.goalMode==='none'}" @click="draft.goalMode='none'">\u4E0D\u8BBE\u5B9A</button><button type="button" :class="{active:draft.goalMode==='price'}" @click="draft.goalMode='price'">\u6309\u4EF7\u683C</button><button v-if="draft.costMode==='day'" type="button" :class="{active:draft.goalMode==='date'}" @click="draft.goalMode='date'">\u6309\u65E5\u671F</button></div></div><label v-if="draft.goalMode==='price'" class="field-row"><span>\u76EE\u6807{{modeLabel(draft)}}\u6210\u672C</span><input type="number" step="0.01" min="0.01" v-model="draft.targetCost" aria-label="\u76EE\u6807\u6210\u672C"/></label><label v-if="draft.goalMode==='date'" class="field-row"><span>\u76EE\u6807\u65E5\u671F</span><input type="date" v-model="draft.targetDate" :min="draft.purchaseDate" aria-label="\u76EE\u6807\u65E5\u671F"/></label></section>
   <section class="card note-editor"><textarea v-model="draft.note" placeholder="\u8BF7\u8F93\u5165\u5907\u6CE8\u4FE1\u606F" maxlength="4000" rows="3" aria-label="\u5907\u6CE8\u4FE1\u606F"></textarea><div class="photo-gallery editing-photos"><div v-for="(photo,idx) in draft.photos" :key="idx"><img :src="photo" alt="\u5907\u6CE8\u56FE\u7247"/><button type="button" @click="draft.photos.splice(idx,1)" aria-label="\u5220\u9664\u5907\u6CE8\u56FE\u7247"><icon name="close" :size="14"/></button></div><label v-if="draft.photos.length<6" class="add-photo"><icon name="image" :size="30"/><input type="file" accept="image/*" multiple @change="uploadImage($event,'photos')" aria-label="\u6DFB\u52A0\u5907\u6CE8\u56FE\u7247"/></label></div></section>
   <section class="card form-group"><div class="field-row"><span>{{draft.kind==='virtual'?'\u6709\u6548\u671F\u9650':'\u4FDD\u969C\u65F6\u95F4'}}</span><toggle v-model="draft.warrantyEnabled" label="\u4FDD\u969C\u65F6\u95F4"/></div><label v-if="draft.warrantyEnabled" class="field-row"><span>{{draft.kind==='virtual'?'\u6709\u6548\u671F\u7ED3\u675F':'\u4FDD\u969C\u7ED3\u675F\u65E5\u671F'}}</span><input type="date" v-model="draft.warrantyEnd" :min="draft.purchaseDate" aria-label="\u4FDD\u969C\u7ED3\u675F\u65E5\u671F"/></label><div v-if="draft.warrantyEnabled" class="field-row"><span>\u542F\u7528\u5230\u671F\u63D0\u9192</span><toggle v-model="draft.warrantyReminder" label="\u542F\u7528\u4FDD\u969C\u5230\u671F\u63D0\u9192"/></div><div class="field-row"><span>\u8D44\u4EA7\u5DF2\u9000\u5F79</span><toggle :model-value="draft.status==='archived'" @update:model-value="changeStatus('archived')" label="\u8D44\u4EA7\u5DF2\u9000\u5F79"/></div><div class="field-row"><span>\u8D44\u4EA7\u5DF2\u552E\u51FA</span><toggle :model-value="draft.status==='sold'" @update:model-value="changeStatus('sold')" label="\u8D44\u4EA7\u5DF2\u552E\u51FA"/></div><label v-if="['sold','archived'].includes(draft.status)" class="field-row"><span>{{draft.status==='sold'?'\u552E\u51FA\u65E5\u671F':'\u9000\u5F79\u65E5\u671F'}}</span><input type="date" v-model="draft.stopDate" :min="draft.purchaseDate" :max="today()" aria-label="\u505C\u6B62\u4F7F\u7528\u65E5\u671F"/></label><label v-if="draft.status==='sold'" class="field-row"><span>\u552E\u51FA\u56DE\u6536\u91D1\u989D</span><input type="number" min="0" step="0.01" v-model="draft.salePrice" aria-label="\u552E\u51FA\u56DE\u6536\u91D1\u989D"/></label></section>
   <section class="card form-group single"><div class="field-row"><span>\u7F6E\u9876\u8D44\u4EA7</span><toggle v-model="draft.pinned" label="\u7F6E\u9876\u8D44\u4EA7"/></div></section><section class="card form-group single"><div class="field-row"><span>\u8D44\u4EA7\u4E0D\u8BA1\u5165\u7EDF\u8BA1</span><toggle v-model="draft.excludeStats" label="\u8D44\u4EA7\u4E0D\u8BA1\u5165\u7EDF\u8BA1"/></div></section><p class="edit-footer">\u8D44\u4EA7\u4FDD\u5B58\u540E\u53EF\u8FDB\u5165\u8BE6\u60C5\u9875\uFF0C\u8FDB\u884C\u8D44\u4EA7\u7EF4\u62A4\u3001\u914D\u4EF6\u53CA\u4F7F\u7528\u8BB0\u5F55\u3002</p><p v-if="error" class="error-message" role="alert">{{error}}</p><button class="primary full-width" type="submit" :disabled="busy">{{busy?'\u6B63\u5728\u4FDD\u5B58\u2026':'\u4FDD\u5B58\u8D44\u4EA7'}}</button>
  </form>

  <template v-if="page==='records'&&item"><section class="card record-summary"><asset-image :item="item"/><div><h2>{{item.name}}</h2><p>{{recordKind==='usage'?'\u7D2F\u8BA1\u4F7F\u7528 '+detail.uses+' \u6B21':money(detail[recordKind],item.currency)+' \u8BA1\u5165\u6210\u672C'}}</p></div></section><div v-if="recentRecords.length" class="record-list"><section v-for="r in recentRecords" :key="r.id" class="card record-card"><div class="section-row"><h3>{{recordKind==='usage'?'\u8BB0\u5F55\u4F7F\u7528':r.name}}</h3><strong :class="recordKind==='maintenance'?'amber':'accent'">{{recordKind==='usage'?(r.quantity?r.quantity+' '+item.quantityUnit:r.count+' \u6B21'):money(r.amount,item.currency)}}</strong></div><div class="section-row"><p>{{r.date}} <span v-if="recordKind!=='usage'">\xB7 {{r.include===false?'\u4EC5\u8BB0\u5F55':'\u8BA1\u5165\u6210\u672C'}}</span></p><button class="icon-button small" aria-label="\u5220\u9664\u8BB0\u5F55" @click="deleteRecord(r)"><icon name="trash" :size="17"/></button></div><p v-if="r.note" class="record-note">{{r.note}}</p></section></div><div v-else class="empty-state small-empty"><icon :name="recordKind==='usage'?'clock':'wrench'" :size="40"/><h2>\u8FD8\u6CA1\u6709{{recordKind==='usage'?'\u4F7F\u7528':recordKind==='maintenance'?'\u7EF4\u62A4':'\u914D\u4EF6'}}\u8BB0\u5F55</h2><p>\u628A\u6BCF\u4E00\u6B21\u4F7F\u7528\u4E0E\u6295\u5165\uFF0C\u90FD\u8BA4\u771F\u8BB0\u5F55\u4E0B\u6765\u3002</p></div><button class="primary full-width" :disabled="!['active','idle'].includes(item.status)" @click="newRecord()"><icon name="plus" :size="18"/>\u6DFB\u52A0\u8BB0\u5F55</button></template>

  <template v-if="page==='stats'"><div class="home-intro"><span>\u7528\u6570\u636E\uFF0C\u91CD\u65B0\u8BA4\u8BC6\u4F60\u7684\u62E5\u6709\u3002</span><label class="currency-control"><select v-model="currency" aria-label="\u7EDF\u8BA1\u5E01\u79CD"><option>CNY</option><option>USD</option><option>EUR</option><option>HKD</option><option>JPY</option></select></label></div><div class="stats-grid"><section class="card stat"><span class="label">\u7D2F\u8BA1\u6295\u5165</span><strong>{{money(summary.spend,currency)}}</strong><small>{{summary.count}} \u4EF6\u7EB3\u5165\u7EDF\u8BA1</small></section><section class="card stat"><span class="label">\u5F53\u524D\u65E5\u5747\u6210\u672C</span><strong class="accent">{{money(summary.daily,currency)}}</strong><small>\u4F7F\u7528\u4E2D\u4E0E\u95F2\u7F6E\u7684\u6309\u65E5\u8D44\u4EA7</small></section><section class="card stat"><span class="label">\u7EF4\u62A4\u4E0E\u914D\u4EF6</span><strong>{{money(summary.maintenance,currency)}}</strong><small>\u5DF2\u8BA1\u5165\u6210\u672C\u7684\u8BB0\u5F55</small></section><section class="card stat"><span class="label">\u552E\u51FA\u56DE\u6536</span><strong>{{money(summary.recovered,currency)}}</strong><small>\u51C0\u6295\u5165 {{money(summary.total,currency)}}</small></section></div><section class="card"><div class="section-row"><h3>\u6295\u5165\u8D8B\u52BF</h3><div class="segmented small"><button v-for="g in [{v:'day',n:'\u65E5'},{v:'month',n:'\u6708'},{v:'year',n:'\u5E74'}]" :class="{active:granularity===g.v}" @click="granularity=g.v;chartSelected=-1">{{g.n}}</button></div></div><p class="chart-readout">{{chartSelected<0?'\u6700\u8FD1\u516D\u4E2A\u5468\u671F \xB7 \u8D2D\u5165\u4E0E\u8FFD\u52A0\u6295\u5165':expenseBars[chartSelected]?.date+' \xB7 '+money(expenseBars[chartSelected]?.value||0,currency)}}</p><div class="bar-chart stats-bars"><button v-for="(b,idx) in expenseBars" class="bar-column" :class="{chosen:chartSelected===idx}" @click="chartSelected=idx" :aria-label="b.date+' \u6295\u5165 '+b.value"><span class="bar" :style="{height:Math.max(2,b.value/barsMax(expenseBars)*95)+'%'}"></span><span class="bar-label">{{b.label}}</span></button></div></section><section class="card"><div class="section-row"><h3>\u5206\u7C7B\u6295\u5165\u5360\u6BD4</h3><span class="muted tiny">{{currency}}</span></div><div v-if="categoryStats.length" class="category-bars"><button v-for="(c,idx) in categoryStats" @click="selectCategory(c)"><div class="section-row"><span><i :style="{background:['#32c89a','#61a5fa','#c39ced','#f3bc58','#ec8ca0'][idx%5]}"></i>{{c.name}} <small>{{c.count}} \u4EF6</small></span><strong>{{money(c.amount,currency)}}</strong></div><div class="category-track"><span :style="{width:(summary.spend?c.amount/summary.spend*100:0)+'%',background:['#32c89a','#61a5fa','#c39ced','#f3bc58','#ec8ca0'][idx%5]}"></span></div></button></div><p v-else class="empty-inline">\u6DFB\u52A0\u7269\u54C1\u540E\uFF0C\u8FD9\u91CC\u5C06\u5448\u73B0\u4F60\u7684\u8D44\u4EA7\u6784\u6210\u3002</p></section><section class="card"><div class="section-row"><h3>\u65E5\u5747\u6210\u672C\u6392\u884C</h3><span class="muted tiny">\u9AD8 \u2192 \u4F4E</span></div><button v-for="(i,idx) in rank" class="rank-row" @click="openItem(i)"><span class="rank-number">0{{idx+1}}</span><asset-image :item="i"/><span class="rank-name">{{i.name}}</span><strong>{{money(metrics(i).current||0,i.currency)}}</strong></button><p v-if="!rank.length" class="empty-inline">\u6682\u65E0\u6309\u65E5\u8BA1\u7B97\u7684\u5728\u7528\u8D44\u4EA7\u3002</p></section><p class="subtle-note">\u4EC5\u6C47\u603B {{currency}}\uFF0C\u4E0D\u6362\u7B97\u6C47\u7387\u3002\u6392\u9664\u6807\u8BB0\u4E3A\u201C\u4E0D\u8BA1\u5165\u7EDF\u8BA1\u201D\u7684\u8D44\u4EA7\u3002<br/>\u65E5\u5747\u6210\u672C\u5408\u8BA1\u4E0D\u5305\u542B\u6309\u6B21\u3001\u6309\u91CF\u8D44\u4EA7\u3002</p></template>

  <template v-if="page==='settings'"><section class="profile"><span class="profile-avatar"><icon name="bag" :size="30"/></span><div><h2>{{db.settings.name||'\u6211\u7684\u6301\u7269'}}</h2><p>\u597D\u597D\u62E5\u6709\uFF0C\u597D\u597D\u4F7F\u7528\u3002</p></div><span class="local-badge"><span class="status-dot"></span>\u672C\u5730\u4FDD\u5B58</span></section><section class="card settings-menu"><button @click="go('categories')"><span class="menu-icon"><icon name="tag"/></span><span>\u5206\u7C7B\u7BA1\u7406</span><small>{{categories.length}} \u4E2A\u5206\u7C7B</small><icon name="chevron" :size="17"/></button><button @click="openManage('channel')"><span class="menu-icon"><icon name="bag"/></span><span>\u8D2D\u4E70\u6E20\u9053</span><small>{{db.settings.channels.length}} \u9879</small><icon name="chevron" :size="17"/></button><button @click="openManage('status')"><span class="menu-icon"><icon name="tag"/></span><span>\u81EA\u5B9A\u4E49\u72B6\u6001</span><icon name="chevron" :size="17"/></button></section><section class="card settings-menu"><button @click="installApp"><span class="menu-icon"><icon name="plus"/></span><span>{{standalone?'\u5DF2\u6DFB\u52A0\u5230\u684C\u9762':'\u6DFB\u52A0\u5230\u684C\u9762'}}</span><icon name="chevron" :size="17"/></button><button @click="go('backup')"><span class="menu-icon"><icon name="download"/></span><span>\u6570\u636E\u5907\u4EFD\u4E0E\u6062\u590D</span><icon name="chevron" :size="17"/></button><button @click="themeToggle"><span class="menu-icon"><icon :name="db.settings.theme==='dark'?'moon':'sun'"/></span><span>\u5916\u89C2\u4E3B\u9898</span><small>{{db.settings.theme==='dark'?'\u6DF1\u8272':'\u6D45\u8272'}}</small><icon name="chevron" :size="17"/></button><button @click="openSettings"><span class="menu-icon"><icon name="settings"/></span><span>\u4E2A\u4EBA\u4E0E\u63D0\u9192\u8BBE\u7F6E</span><icon name="chevron" :size="17"/></button></section><section class="card settings-menu"><button @click="go('help')"><span class="menu-icon"><icon name="info"/></span><span>\u4F7F\u7528\u8BF4\u660E</span><icon name="chevron" :size="17"/></button><button @click="modal='about'"><span class="menu-icon"><icon name="box"/></span><span>\u5173\u4E8E\u4E0E\u5F00\u6E90\u8BF4\u660E</span><small>1.0</small><icon name="chevron" :size="17"/></button></section><div class="privacy-note"><icon name="shield" :size="23"/><h3>\u4F60\u7684\u7269\u54C1\uFF0C\u53EA\u5C5E\u4E8E\u4F60</h3><p>\u65E0\u9700\u767B\u5F55\uFF0C\u6570\u636E\u4FDD\u5B58\u5728\u5F53\u524D\u6D4F\u89C8\u5668\u3002<br/>\u8BF7\u5B9A\u671F\u5BFC\u51FA\u5907\u4EFD\uFF0C\u6362\u8BBE\u5907\u65F6\u518D\u5BFC\u5165\u3002</p></div></template>

  <template v-if="page==='categories'"><p class="subtle-note align-left">\u5206\u7C7B\u53EF\u65B0\u589E\u3001\u91CD\u547D\u540D\uFF1B\u5220\u9664\u6709\u7269\u54C1\u7684\u5206\u7C7B\u65F6\uFF0C\u5148\u8FC1\u79FB\u7269\u54C1\u3002</p><section class="card settings-menu"><div v-for="c in categories" class="category-manage"><button class="category-name" @click="selectCategory(c)"><span class="menu-icon"><icon name="tag" :size="20"/></span><strong>{{c.name}}</strong><small>{{allItems.filter(i=>i.categoryId===c.id).length}} \u4EF6</small></button><button class="icon-button small" @click="openCategoryEditor(c)" :aria-label="'\u91CD\u547D\u540D'+c.name"><icon name="edit" :size="17"/></button><button class="icon-button small" @click="deleteCategory(c)" :aria-label="'\u5220\u9664\u5206\u7C7B'+c.name"><icon name="trash" :size="17"/></button></div></section><button class="primary full-width" @click="openCategoryEditor()"><icon name="plus" :size="18"/>\u65B0\u589E\u5206\u7C7B</button></template>

  <template v-if="page==='reminders'"><div class="kind-tabs"><button :class="{active:reminderTab==='pending'}" @click="reminderTab='pending'">\u5F85\u5904\u7406 {{alerts.length}}</button><button :class="{active:reminderTab==='done'}" @click="reminderTab='done'">\u5DF2\u5B8C\u6210</button></div><p class="subtle-note align-left">\u6253\u5F00\u5E94\u7528\u65F6\u68C0\u67E5\u5230\u671F\u60C5\u51B5\uFF1B\u5173\u95ED\u79BB\u7EBF\u6587\u4EF6\u540E\uFF0C\u4E0D\u4F1A\u53D1\u9001\u7CFB\u7EDF\u901A\u77E5\u3002</p><template v-if="reminderTab==='pending'"><section v-for="r in alerts" :key="r.id" class="card alert-card"><span :class="['alert-icon',r.tone]"><icon :name="r.icon"/></span><button class="alert-content" @click="r.itemId&&openItem({id:r.itemId})"><h3>{{r.title}}</h3><p>{{r.note}}</p><small>{{r.date}}</small></button><button class="complete-button" aria-label="\u6807\u8BB0\u5B8C\u6210" @click="dismissAlert(r)"><icon name="check" :size="19"/></button></section><div v-if="!alerts.length" class="empty-state small-empty"><icon name="check" :size="42"/><h2>\u6240\u6709\u4E8B\u60C5\uFF0C\u90FD\u5B89\u6392\u597D\u4E86</h2><p>\u6682\u65F6\u6CA1\u6709\u5F85\u5904\u7406\u7684\u63D0\u9192\u3002</p></div></template><template v-else><section v-for="r in db.reminders.filter(r=>r.type==='custom'&&r.status==='done')" :key="r.id" class="card alert-card"><icon name="check"/><div class="alert-content"><h3>{{r.title}}</h3><p>{{r.dueDate}}</p></div><button class="text-button" @click="restoreReminder(r)">\u6062\u590D</button></section><p class="empty-inline">{{db.settings.dismissed.length}} \u6761\u7CFB\u7EDF\u63D0\u9192\u5DF2\u5904\u7406\u3002<br/>\u7CFB\u7EDF\u63D0\u9192\u4F1A\u5728\u65B0\u7684\u5230\u671F\u6761\u4EF6\u6216\u65E5\u671F\u4E0B\u91CD\u65B0\u68C0\u67E5\u3002</p></template></template>

  <template v-if="page==='backup'"><section class="card backup-card"><span class="backup-icon"><icon name="shield" :size="34"/></span><h2>\u7ED9\u4F60\u7684\u8BB0\u5F55\u7559\u4E00\u4EFD\u5907\u4EFD</h2><p>\u5B8C\u6574\u5907\u4EFD\u5305\u62EC\u7269\u54C1\u3001\u7167\u7247\u3001\u5206\u7C7B\u3001<br/>\u76EE\u6807\u3001\u7EF4\u62A4\u3001\u914D\u4EF6\u3001\u4F7F\u7528\u8BB0\u5F55\u4E0E\u8BBE\u7F6E\u3002</p><button class="primary full-width" @click="exportBackup"><icon name="download" :size="18"/>\u5BFC\u51FA\u5B8C\u6574\u5907\u4EFD JSON</button><button class="secondary full-width" @click="exportCsv">\u5BFC\u51FA\u8D44\u4EA7\u6E05\u5355 CSV</button></section><section class="card"><h3>\u6062\u590D\u4E0E\u8FC1\u79FB</h3><p class="body-muted">\u9009\u62E9\u6B64\u524D\u5BFC\u51FA\u7684 JSON \u6587\u4EF6\u3002\u652F\u6301\u672C\u5E94\u7528\u5907\u4EFD\u53CA\u7269\u8BB0\u57FA\u7840\u6570\u636E\u3002</p><label class="secondary full-width upload-backup"><icon name="upload" :size="18"/>\u9009\u62E9\u5907\u4EFD\u6587\u4EF6<input type="file" accept=".json,application/json" @change="chooseBackup"/></label><details class="paste-import"><summary>\u4E5F\u53EF\u4EE5\u7C98\u8D34\u5907\u4EFD\u5185\u5BB9</summary><textarea v-model="importText" placeholder="\u5728\u8FD9\u91CC\u7C98\u8D34 JSON \u5907\u4EFD\u5185\u5BB9" rows="5" aria-label="\u5907\u4EFD\u5185\u5BB9"></textarea><button class="secondary full-width" @click="previewImport">\u68C0\u67E5\u5907\u4EFD</button></details></section><section class="card settings-menu"><button v-if="!allItems.length" @click="loadDemo"><span>\u8F7D\u5165\u793A\u4F8B\u7269\u54C1</span><icon name="chevron" :size="17"/></button><button @click="clearAll"><span class="danger">\u6E05\u7A7A\u5168\u90E8\u7269\u54C1\u4E0E\u8BB0\u5F55</span><icon name="trash" :size="18"/></button></section><p class="subtle-note">HTML \u662F\u5E94\u7528\u6587\u4EF6\uFF0CJSON \u662F\u4F60\u7684\u6570\u636E\u5907\u4EFD\u3002<br/>\u6E05\u7406\u6D4F\u89C8\u5668\u6570\u636E\u3001\u65E0\u75D5\u6A21\u5F0F\u6216\u66F4\u6362\u6D4F\u89C8\u5668\uFF0C\u53EF\u80FD\u4E22\u5931\u8BB0\u5F55\u3002</p></template>

  <article v-if="page==='help'" class="help-page"><section class="card"><h2>\u5F00\u59CB\u8BB0\u5F55</h2><p>\u70B9\u51FB\u5E95\u90E8\u300C\uFF0B\u300D\uFF0C\u8F93\u5165\u540D\u79F0\u3001\u8D2D\u4E70\u4EF7\u683C\u548C\u65E5\u671F\u3002\u53EF\u4EE5\u9009\u56FE\u6807\uFF0C\u4E5F\u53EF\u4EE5\u4E0A\u4F20\u81EA\u5DF1\u7684\u56FE\u7247\u3002</p><p>\u8D44\u4EA7\u4FDD\u5B58\u540E\uFF0C\u8FDB\u5165\u8BE6\u60C5\u6DFB\u52A0\u7EF4\u62A4\u3001\u914D\u4EF6\u548C\u4F7F\u7528\u8BB0\u5F55\u3002\u4FEE\u6539\u4F1A\u81EA\u52A8\u66F4\u65B0\u6210\u672C\u4E0E\u76EE\u6807\u8FDB\u5EA6\u3002</p></section><section class="card"><h3>\u4E09\u79CD\u6210\u672C\u65B9\u5F0F</h3><p><b>\u6309\u65E5\uFF1A</b>\u51C0\u6295\u5165 \xF7 \u4F7F\u7528\u5929\u6570\uFF0C\u8D2D\u4E70\u5F53\u5929\u8BA11\u5929\u3002\u9000\u5F79\u6216\u552E\u51FA\u540E\uFF0C\u5929\u6570\u56FA\u5B9A\u5728\u7ED3\u675F\u65E5\u671F\u3002</p><p><b>\u6309\u6B21\uFF1A</b>\u51C0\u6295\u5165 \xF7 \u7D2F\u8BA1\u4F7F\u7528\u6B21\u6570\u3002\u521D\u59CB\u6B21\u6570\u52A0\u4E0A\u6BCF\u6761\u65B0\u589E\u8BB0\u5F55\uFF0C\u53EF\u4E00\u5929\u8BB0\u5F55\u591A\u6B21\u3002</p><p><b>\u6309\u91CF\uFF1A</b>\u51C0\u6295\u5165 \xF7 \u7D2F\u8BA1\u7528\u91CF\uFF0C\u4F8B\u5982\u6BCF\u6BEB\u5347\u3001\u6BCF\u514B\u6210\u672C\uFF1B\u5B83\u8868\u793A\u5DF2\u4F7F\u7528\u90E8\u5206\u5206\u644A\u5168\u90E8\u6295\u5165\u540E\u7684\u6210\u672C\u3002</p><p>\u51C0\u6295\u5165\uFF1D\u8D2D\u4E70\u4EF7\uFF0B\u8BA1\u5165\u6210\u672C\u7684\u7EF4\u62A4\u8D39\uFF0B\u914D\u4EF6\u8D39\uFF0D\u552E\u51FA\u56DE\u6536\u3002\u4EC5\u8BB0\u5F55\u7684\u8D39\u7528\u4E0D\u8BA1\u5165\u3002\u56DE\u6536\u8D85\u8FC7\u6295\u5165\u65F6\uFF0C\u51C0\u6295\u5165\u53EF\u4E3A\u8D1F\u6570\u3002</p></section><section class="card"><h3>\u76EE\u6807\u4E0E\u7EDF\u8BA1</h3><p>\u6309\u4EF7\u683C\u8BBE\u5B9A\u671F\u671B\u6210\u672C\uFF1B\u6309\u65E5\u671F\u8BBE\u5B9A\u9884\u671F\u4F7F\u7528\u7EC8\u70B9\u3002\u8FDB\u5EA6\u6839\u636E\u5F53\u524D\u7D2F\u8BA1\u4F7F\u7528\u91CF\u8BA1\u7B97\uFF0C\u9884\u8BA1\u8FBE\u6210\u65E5\u671F\u5047\u8BBE\u4ECA\u540E\u4E0D\u518D\u8FFD\u52A0\u8D39\u7528\u3002</p><p>\u4E0D\u540C\u5E01\u79CD\u5355\u72EC\u6C47\u603B\uFF0C\u4E0D\u4F7F\u7528\u5B9E\u65F6\u6C47\u7387\u3002\u300C\u4E0D\u8BA1\u5165\u7EDF\u8BA1\u300D\u4F1A\u6392\u9664\u8BE5\u7269\u54C1\uFF1B\u6309\u6B21\u3001\u6309\u91CF\u6210\u672C\u4E0D\u4F1A\u6DF7\u5165\u65E5\u5747\u5408\u8BA1\u3002</p><p>\u6295\u8D44\u7C7B\u652F\u6301\u624B\u52A8\u4F30\u503C\u4E0E\u6295\u5165\u5DEE\u989D\uFF0C\u865A\u62DF\u7C7B\u53EF\u8BB0\u5F55\u4F1A\u5458\u3001\u8F6F\u4EF6\u7B49\u7684\u6709\u6548\u671F\u3002\u5230\u671F\u63D0\u9192\u5728\u6253\u5F00\u5E94\u7528\u65F6\u68C0\u67E5\u3002</p></section><section class="card"><h3>\u4FDD\u5B58\u4E0E\u8BBE\u5907\u8FC1\u79FB</h3><p>\u672C\u6587\u4EF6\u79BB\u7EBF\u53EF\u7528\uFF0C\u6240\u6709\u4EE3\u7801\u5747\u5DF2\u5305\u542B\u3002\u6570\u636E\u4FDD\u5B58\u5728\u5F53\u524D\u6D4F\u89C8\u5668\uFF0C\u4E0D\u4F1A\u81EA\u52A8\u8DE8\u8BBE\u5907\u540C\u6B65\u3002</p><p>\u5EFA\u8BAE\u56FA\u5B9A\u4F7F\u7528\u540C\u4E00\u4E2A\u6587\u4EF6\u8DEF\u5F84\u53CA\u6D4F\u89C8\u5668\u3002\u624B\u673A\u8BF7\u5C06 HTML \u4E0B\u8F7D\u540E\u7528\u6D4F\u89C8\u5668\u6253\u5F00\uFF1B\u804A\u5929\u8F6F\u4EF6\u7684\u6587\u4EF6\u9884\u89C8\u53EF\u80FD\u4E0D\u80FD\u8FD0\u884C\u4EA4\u4E92\u3002</p><p>\u5B9A\u671F\u5728\u300C\u6211\u7684 \u2192 \u6570\u636E\u5907\u4EFD\u300D\u5BFC\u51FA JSON\u3002\u66F4\u6362\u8BBE\u5907\u6216\u6D4F\u89C8\u5668\u540E\u5BFC\u5165\u3002\u5408\u5E76\u5BFC\u5165\u4FDD\u7559\u5DF2\u6709\u540C\u7F16\u53F7\u7269\u54C1\uFF0C\u66FF\u6362\u5BFC\u5165\u4F1A\u8986\u76D6\u5168\u90E8\u73B0\u6709\u6570\u636E\u3002</p><p>\u672C\u5730\u6587\u4EF6\u5173\u95ED\u540E\u4E0D\u53D1\u9001\u540E\u53F0\u901A\u77E5\u3002\u8981\u7A33\u5B9A\u5730\u901A\u8FC7\u624B\u673A\u7F51\u5740\u4F7F\u7528\uFF0C\u53EF\u5C06\u6B64 HTML \u653E\u5230\u9759\u6001\u7F51\u9875\u6258\u7BA1\u670D\u52A1\u3002</p></section></article>

 <div v-if="modal" class="modal-backdrop" @click.self="!busy&&(modal='')"><section class="modal" role="dialog" aria-modal="true" :aria-label="modal==='record'?'\u6DFB\u52A0\u8BB0\u5F55':modal"><div class="modal-handle"></div><div class="modal-heading"><h2>{{{install:'\u6DFB\u52A0\u5230\u684C\u9762',sort:'\u6392\u5E8F\u65B9\u5F0F',record:recordKind==='maintenance'?'\u6DFB\u52A0\u7EF4\u62A4\u8BB0\u5F55':recordKind==='accessories'?'\u6DFB\u52A0\u914D\u4EF6':'\u8BB0\u5F55\u4F7F\u7528',category:renameId?'\u91CD\u547D\u540D\u5206\u7C7B':'\u65B0\u589E\u5206\u7C7B',migrate:'\u8FC1\u79FB\u7269\u54C1\u5E76\u5220\u9664\u5206\u7C7B',reminder:'\u65B0\u589E\u63D0\u9192',settings:'\u4E2A\u4EBA\u4E0E\u63D0\u9192\u8BBE\u7F6E',manage:manageMode==='channel'?'\u8D2D\u4E70\u6E20\u9053':'\u81EA\u5B9A\u4E49\u72B6\u6001',import:'\u5BFC\u5165\u5907\u4EFD',batchCategory:'\u79FB\u52A8\u5230\u5206\u7C7B',about:'\u5173\u4E8E\u6301\u7269'}[modal]}}</h2><button class="icon-button small" @click="modal=''" aria-label="\u5173\u95ED\u5F39\u7A97"><icon name="close" :size="20"/></button></div>
   <template v-if="modal==='sort'"><button v-for="s in [{v:'updatedAt',n:'\u6700\u8FD1\u66F4\u65B0'},{v:'purchaseDate',n:'\u8D2D\u4E70\u65E5\u671F'},{v:'price',n:'\u8D2D\u4E70\u4EF7\u683C'},{v:'dailyCost',n:'\u5F53\u524D\u5355\u4F4D\u6210\u672C'}]" class="option-row" @click="sort=s.v"><span>{{s.n}}</span><icon v-if="sort===s.v" class="accent" name="check"/></button><div class="segmented sort-order"><button :class="{active:sortOrder==='desc'}" @click="sortOrder='desc'">\u4ECE\u9AD8\u5230\u4F4E\uFF0F\u4ECE\u65B0\u5230\u65E7</button><button :class="{active:sortOrder==='asc'}" @click="sortOrder='asc'">\u4ECE\u4F4E\u5230\u9AD8\uFF0F\u4ECE\u65E7\u5230\u65B0</button></div><p class="subtle-note">\u7F6E\u9876\u7269\u54C1\u59CB\u7EC8\u6392\u5728\u524D\u9762\u3002\u4E0D\u540C\u5E01\u79CD\u6392\u5E8F\u6309\u539F\u5E01\u6570\u503C\u3002</p><button class="primary full-width" @click="modal=''">\u5B8C\u6210</button></template>
   <form v-if="modal==='record'" @submit.prevent="saveRecord"><label v-if="recordKind!=='usage'" class="modal-field">{{recordKind==='maintenance'?'\u7EF4\u62A4\u5185\u5BB9':'\u914D\u4EF6\u540D\u79F0'}}<input v-model="record.name" :placeholder="recordKind==='maintenance'?'\u4F8B\u5982\uFF1A\u66F4\u6362\u7535\u6C60':'\u4F8B\u5982\uFF1A\u4FDD\u62A4\u58F3'" autofocus maxlength="100"/></label><label class="modal-field">\u65E5\u671F<input type="date" v-model="record.date" :min="item.purchaseDate" :max="today()"/></label><label v-if="recordKind!=='usage'" class="modal-field">\u8D39\u7528\uFF08{{item.currency}}\uFF09<input type="number" min="0" step="0.01" v-model="record.amount" placeholder="0.00" inputmode="decimal"/></label><template v-else><label class="modal-field">\u4F7F\u7528\u6B21\u6570<input type="number" min="0" step="1" v-model="record.count"/></label><label v-if="item.costMode==='quantity'" class="modal-field">\u672C\u6B21\u7528\u91CF\uFF08{{item.quantityUnit}}\uFF09<input type="number" min="0.01" step="0.01" v-model="record.quantity"/></label></template><label class="modal-field">\u5907\u6CE8<textarea v-model="record.note" placeholder="\u9009\u586B" rows="2" maxlength="1000"></textarea></label><div v-if="recordKind!=='usage'" class="field-row"><span>\u8BA1\u5165\u8D44\u4EA7\u6210\u672C</span><toggle v-model="record.include" label="\u8BA1\u5165\u8D44\u4EA7\u6210\u672C"/></div><p v-if="error" class="error-message" role="alert">{{error}}</p><button class="primary full-width" :disabled="busy">\u4FDD\u5B58\u8BB0\u5F55</button></form>
   <form v-if="modal==='category'" @submit.prevent="saveCategory"><label class="modal-field">\u5206\u7C7B\u540D\u79F0<input v-model="categoryDraft" autofocus maxlength="30" placeholder="\u4F8B\u5982\uFF1A\u53A8\u623F\u7535\u5668"/></label><p v-if="error" class="error-message">{{error}}</p><button class="primary full-width" :disabled="busy">\u4FDD\u5B58\u5206\u7C7B</button></form>
   <template v-if="modal==='migrate'||modal==='batchCategory'"><p class="body-muted">{{modal==='migrate'?'\u201C'+categoryDraft+'\u201D\u4E2D\u7684\u7269\u54C1\u5C06\u79FB\u5165\u9009\u5B9A\u5206\u7C7B\uFF0C\u7136\u540E\u5220\u9664\u539F\u5206\u7C7B\u3002':'\u5C06\u9009\u4E2D\u7684 '+selectedIds.length+' \u4EF6\u7269\u54C1\u79FB\u5165\u5206\u7C7B\u3002'}}</p><label class="modal-field">\u76EE\u6807\u5206\u7C7B<select v-model="migrationTo"><option v-for="c in categories.filter(c=>modal!=='migrate'||c.id!==renameId)" :value="c.id">{{c.name}}</option></select></label><p v-if="error" class="error-message">{{error}}</p><button class="primary full-width" @click="modal==='migrate'?migrateCategory():batchCategory()" :disabled="busy">\u786E\u8BA4\u79FB\u52A8</button></template>
